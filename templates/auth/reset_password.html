{% extends "base.html" %}
{% block page_title %}Choose a New Password &bull; Your Life Your Home{% endblock %}
{% block content %}
{% include "auth/_auth_styles.html" %}
<div class="auth-page">
  <div class="auth-card">
    <h1>Choose a new password</h1>
    <p class="lead">Use at least 8 characters. This link works once and expires in one hour.</p>
    <form method="post">
      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required autofocus />
      <label for="confirm_password">Confirm new password</label>
      <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required />
      <button class="btn-primary" type="submit">Update password</button>
    </form>
  </div>
</div>
{% endblock %}
