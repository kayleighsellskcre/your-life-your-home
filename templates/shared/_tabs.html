{% if tabs %}
<style>
  .ylh-tabs { display: flex; gap: .4rem; max-width: 760px; margin: .6rem auto 0; padding: 0 1rem; }
  .ylh-tabs a { flex: 1; text-align: center; padding: .7rem .4rem; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: .95rem; line-height: 1.2; color: #6B4630; background: #FFFDFA; border: 1.5px solid rgba(143,98,68,.28); }
  .ylh-tabs a.on { background: #8F6244; color: #fff; border-color: #8F6244; box-shadow: 0 2px 10px rgba(110,72,40,.22); }
  .ylh-tabs .ylh-tab-badge { display: inline-block; min-width: 1.2rem; padding: 0 .35rem; margin-left: .2rem; border-radius: 99px; background: #A0392D; color: #fff; font-size: .72rem; text-align: center; }
  @media (max-width: 420px) { .ylh-tabs a { font-size: .85rem; padding: .65rem .2rem; } }
</style>
<nav class="ylh-tabs" aria-label="Main sections">
  {% for label, href, on, badge in tabs %}<a href="{{ href }}" {% if on %}class="on" aria-current="page"{% endif %}>{{ label }}{% if badge %}<span class="ylh-tab-badge">{{ badge }}</span>{% endif %}</a>{% endfor %}
</nav>
{% if back_home %}<div style="max-width:760px;margin:.35rem auto 0;padding:0 1rem;"><a href="{{ back_home[1] }}" style="display:inline-block;padding:.3rem 0;color:#7A5238;font-weight:600;font-size:.9rem;text-decoration:none;">&larr; {{ back_home[0] }}</a></div>{% endif %}
{% endif %}
