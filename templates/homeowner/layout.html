{% extends "base.html" %}

{% block title %}Home Dashboard{% endblock %}

{% block content %}
<style>
 /* ===========================
 LUXURIOUS DASHBOARD NAVIGATION
 Professional • Uniform • Perfect Spacing
 =========================== */
 
 :root {
 --nav-height: 56px;
 --nav-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
 }
 
 /* NAVIGATION BAR — hidden; use hamburger menu to navigate */
 .ylh-horizontal-nav {
 display: none !important;
 }
 
 .ylh-nav-container {
 max-width: 1600px;
 margin: 0 auto;
 display: flex;
 align-items: center;
 justify-content: space-between;
 padding: 0 2rem;
 height: var(--nav-height);
 gap: 0.6rem;
 }
 
 /* DASHBOARD TITLE */
 .ylh-nav-title {
 font-family: 'Playfair Display', Georgia, serif;
 font-size: 1.25rem;
 color: #6B5B4D;
 font-weight: 500;
 letter-spacing: 0.01em;
 margin: 0;
 white-space: nowrap;
 flex-shrink: 0;
 }
 
 /* NAVIGATION ITEMS CONTAINER */
 .ylh-nav-items {
 display: flex !important;
 align-items: center !important;
 gap: 0.25rem !important;
 flex: 1 !important;
 justify-content: center !important;
 opacity: 1 !important;
 visibility: visible !important;
 }
 
 .ylh-nav-items > * {
 opacity: 1 !important;
 visibility: visible !important;
 display: inline-flex !important;
 }
 
 /* NAVIGATION BUTTONS - UNIFORM STYLING */
 .ylh-nav-button {
 background: transparent !important;
 border: none !important;
 color: #6B5B4D !important;
 padding: 0.75rem 1.25rem !important;
 font-family: var(--nav-font) !important;
 font-size: 0.8125rem !important;
 font-weight: 600 !important;
 text-transform: uppercase !important;
 letter-spacing: 0.075em !important;
 cursor: pointer !important;
 transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1) !important;
 white-space: nowrap !important;
 border-radius: 6px !important;
 text-decoration: none !important;
 display: inline-flex !important;
 align-items: center !important;
 justify-content: center !important;
 position: relative !important;
 min-height: auto !important;
 }
 
 .ylh-nav-button::after {
 content: '';
 position: absolute;
 bottom: 6px;
 left: 50%;
 width: 0;
 height: 2px;
 background: #6B5B4D;
 transform: translateX(-50%);
 transition: width 0.3s ease;
 }
 
 .ylh-nav-button:hover {
 background: rgba(107, 91, 77, 0.08) !important;
 color: #3D2E24 !important;
 }
 
 .ylh-nav-button:hover::after {
 width: 70% !important;
 }
 
 .ylh-nav-button.active {
 background: rgba(107, 91, 77, 0.12) !important;
 color: #3D2E24 !important;
 font-weight: 700 !important;
 }
 
 .ylh-nav-button.active::after {
 width: 70% !important;
 }
 
 /* DROPDOWN CONTAINER */
 .ylh-dropdown {
 position: relative !important;
 display: inline-block !important;
 flex-shrink: 0 !important;
 opacity: 1 !important;
 visibility: visible !important;
 }
 
 /* DROPDOWN MENU */
 .ylh-dropdown-menu {
 position: absolute;
 top: calc(100% + 8px);
 left: 0;
 background: white;
 min-width: 240px;
 border-radius: 8px;
 box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
 border: 1px solid rgba(107, 91, 77, 0.15);
 opacity: 0;
 visibility: hidden;
 transform: translateY(-10px);
 transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
 z-index: 1000;
 overflow: hidden;
 }
 
 .ylh-dropdown.is-open .ylh-dropdown-menu {
 opacity: 1;
 visibility: visible;
 transform: translateY(0);
 }
 
 /* DROPDOWN ITEMS */
 .ylh-dropdown-item {
 display: block;
 padding: 0.875rem 1.25rem;
 color: #3D2E24;
 text-decoration: none;
 font-family: var(--nav-font);
 font-size: 0.875rem;
 font-weight: 500;
 transition: all 0.2s ease;
 border-left: 3px solid transparent;
 }
 
 .ylh-dropdown-item:hover {
 background: #f6f2e8;
 border-left-color: #C2B1A1;
 padding-left: 1.5rem;
 }
 
 .ylh-dropdown-item.active {
 background: #efe9dc;
 color: #6B5B4D;
 font-weight: 600;
 border-left-color: #6B5B4D;
 }
 
 /* AGENT/LENDER INFO - RIGHT SIDE */
 .agent-info-widget {
 display: flex;
 align-items: center;
 gap: 0.75rem;
 flex-shrink: 0;
 }
 
 .agent-lender-card {
 display: flex;
 align-items: center;
 gap: 0.625rem;
 padding: 0.5rem 0.875rem;
 background: white;
 border: 1px solid rgba(107, 91, 77, 0.15);
 border-radius: 8px;
 box-shadow: 0 2px 8px rgba(61, 46, 36, 0.06);
 transition: all 0.2s ease;
 }
 
 .agent-lender-card:hover {
 box-shadow: 0 4px 12px rgba(61, 46, 36, 0.1);
 }
 
 .agent-lender-photo {
 width: 36px;
 height: 36px;
 border-radius: 50%;
 object-fit: cover;
 border: 2px solid #C2B1A1;
 flex-shrink: 0;
 }
 
 .agent-lender-photo-placeholder {
 width: 36px;
 height: 36px;
 border-radius: 50%;
 background: #6B5B4D;
 display: flex;
 align-items: center;
 justify-content: center;
 color: white;
 font-size: 0.95rem;
 font-weight: 600;
 flex-shrink: 0;
 }
 
 .agent-lender-info {
 display: flex;
 flex-direction: column;
 gap: 0.125rem;
 min-width: 0;
 }
 
 .agent-lender-label {
 font-size: 0.625rem;
 color: rgba(61, 46, 36, 0.78);
 text-transform: uppercase;
 letter-spacing: 0.06em;
 font-weight: 600;
 }
 
 .agent-lender-name {
 font-size: 0.75rem;
 color: #3D2E24;
 font-weight: 600;
 white-space: nowrap;
 overflow: hidden;
 text-overflow: ellipsis;
 max-width: 140px;
 }
 
 /* MOBILE RESPONSIVE */
 @media (max-width: 1200px) {
 .ylh-nav-container {
 gap: 1rem;
 }
 
 .ylh-nav-items {
 gap: 0.125rem;
 }
 
 .ylh-nav-button {
 padding: 0.625rem 0.875rem !important;
 font-size: 0.75rem !important;
 }
 
 .agent-info-widget {
 gap: 0.5rem;
 }
 }
 
 @media (max-width: 968px) {
 .ylh-nav-container {
 flex-wrap: wrap;
 height: auto;
 padding: 0.75rem 1.5rem;
 gap: 0.75rem;
 }
 
 .ylh-nav-title {
 font-size: 1.125rem;
 width: 100%;
 text-align: center;
 padding-bottom: 0.5rem;
 border-bottom: 1px solid rgba(107, 91, 77, 0.15);
 }
 
 .ylh-nav-items {
 width: 100%;
 justify-content: center;
 flex-wrap: wrap;
 gap: 0.375rem;
 }
 
 .ylh-nav-button {
 padding: 0.625rem 1rem !important;
 font-size: 0.75rem !important;
 }
 
 .agent-info-widget {
 width: 100%;
 justify-content: center;
 padding-top: 0.5rem;
 border-top: 1px solid rgba(107, 91, 77, 0.15);
 }
 
 .ylh-dropdown-menu {
 position: fixed;
 top: auto;
 bottom: 0;
 left: 0;
 right: 0;
 width: 100%;
 min-width: 100%;
 max-height: 60vh;
 border-radius: 16px 16px 0 0;
 transform: translateY(100%);
 }
 
 .ylh-dropdown.is-open .ylh-dropdown-menu {
 transform: translateY(0);
 }
 }
 
 @media (max-width: 640px) {
 .ylh-nav-container {
 padding: 0.625rem 1rem;
 }
 
 .ylh-nav-title {
 font-size: 1rem;
 }
 
 .ylh-nav-button {
 padding: 0.5rem 0.75rem !important;
 font-size: 0.7rem !important;
 }
 
 .agent-lender-card {
 padding: 0.375rem 0.625rem;
 }
 
 .agent-lender-photo,
 .agent-lender-photo-placeholder {
 width: 32px;
 height: 32px;
 }
 
 .agent-lender-name {
 font-size: 0.7rem;
 max-width: 100px;
 }
 }
</style>

<!-- Navigation Bar -->


<!-- Main Content Area -->
{% block homeowner_content %}{% endblock %}

{% endblock %}
